version: '3.8'

services:
  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: vybe-backend
    ports:
      - "4000:4000"
    env_file:
      - ./Server/.env
    # Restart automatically if it crashes
    restart: always

  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: vybe-frontend
    ports:
      - "3000:80"
    # The frontend shouldn't start until the backend is up
    depends_on:
      - backend
    restart: always
