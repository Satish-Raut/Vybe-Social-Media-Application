server {
    listen 80;
    server_name localhost;

    # Where the static files are served from
    root /usr/share/nginx/html;
    index index.html index.htm;

    # This is crucial for React Router (Single Page Application)!
    # It tells Nginx: If a file isn't found, send index.html instead.
    # Without this, refreshing a page like /profile will return a 404 error.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets for better performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Standard error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
