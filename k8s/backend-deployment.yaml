apiVersion: apps/v1
kind: Deployment
metadata:
  name: vybe-backend
spec:
  replicas: 1 # Running 1 copy to maintain single-state SSE memory
  selector:
    matchLabels:
      app: vybe-backend
  template:
    metadata:
      labels:
        app: vybe-backend
    spec:
      containers:
      - name: backend
        # Note: In production, this will be your AWS ECR image URI.
        # For now, we use the local image we just built.
        image: socialmediaplatformvybe-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
        envFrom:
        - secretRef:
            name: vybe-secrets # Pulls all variables from secret.yaml
